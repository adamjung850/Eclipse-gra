<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Delveria | 2D Sandbox RPG</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Cache-busting Import Map so all ES sub-modules always refresh cleanly on page reload -->
  <script type="importmap">
    {
      "imports": {
        "/js/main.js": "/js/main.js?v=7.5",
        "/js/entities/DroppedItem.js": "/js/entities/DroppedItem.js?v=7.5",
        "/js/entities/Enemy.js": "/js/entities/Enemy.js?v=7.5",
        "/js/entities/Player.js": "/js/entities/Player.js?v=7.5",
        "/js/entities/Projectile.js": "/js/entities/Projectile.js?v=7.5",
        "/js/entities/VormakBoss.js": "/js/entities/VormakBoss.js?v=7.5",
        "/js/scenes/BootScene.js": "/js/scenes/BootScene.js?v=7.5",
        "/js/scenes/IntroScene.js": "/js/scenes/IntroScene.js?v=7.5",
        "/js/scenes/MainMenuScene.js": "/js/scenes/MainMenuScene.js?v=7.5",
        "/js/scenes/GameScene.js": "/js/scenes/GameScene.js?v=7.5",
        "/js/scenes/UIScene.js": "/js/scenes/UIScene.js?v=7.5",
        "/js/systems/CombatSystem.js": "/js/systems/CombatSystem.js?v=7.5",
        "/js/systems/CursorManager.js": "/js/systems/CursorManager.js?v=7.5",
        "/js/systems/DarknessSystem.js": "/js/systems/DarknessSystem.js?v=7.5",
        "/js/systems/DayNightSystem.js": "/js/systems/DayNightSystem.js?v=7.5",
        "/js/systems/EnemySpawner.js": "/js/systems/EnemySpawner.js?v=7.5",
        "/js/systems/InputManager.js": "/js/systems/InputManager.js?v=7.5",
        "/js/systems/MiningSystem.js": "/js/systems/MiningSystem.js?v=7.5",
        "/js/systems/SoundSynthesizer.js": "/js/systems/SoundSynthesizer.js?v=7.5",
        "/js/textures/TextureGenerator.js": "/js/textures/TextureGenerator.js?v=7.5",
        "/js/textures/TreeSprites.js": "/js/textures/TreeSprites.js?v=7.5",
        "/js/types/index.js": "/js/types/index.js?v=7.5",
        "/js/ui/HUD.js": "/js/ui/HUD.js?v=7.5",
        "/js/world/BiomeSystem.js": "/js/world/BiomeSystem.js?v=7.5",
        "/js/world/BlockTypes.js": "/js/world/BlockTypes.js?v=7.5",
        "/js/world/ChestSystem.js": "/js/world/ChestSystem.js?v=7.5",
        "/js/world/CraftingRecipes.js": "/js/world/CraftingRecipes.js?v=7.5",
        "/js/world/ItemTypes.js": "/js/world/ItemTypes.js?v=7.5",
        "/js/world/WorldGenerator.js": "/js/world/WorldGenerator.js?v=7.5",
        "/js/world/WorldManager.js": "/js/world/WorldManager.js?v=7.5"
      }
    }
  </script>
  <!-- Phaser 3 Engine (Local first, CDN fallback) -->
  <script src="lib/phaser.min.js"></script>
  <script>
    if (typeof Phaser === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="game-container"></div>

  <div id="ui-overlay">
    <!-- Controls Guide Pill -->
    <div class="controls-pill interactive">
      <h4>Sterowanie [Etap 4: Biomy i Podziemia]</h4>
      <div><span class="key">A</span> / <span class="key">D</span> Poruszanie</div>
      <div><span class="key">SPACE</span> / <span class="key">W</span> Skok</div>
      <div><span class="key">LPM</span> Atak bronią / Kopanie / Budowanie</div>
      <div><span class="key">1-9</span> Wybór slotu hotbara</div>
      <div><span class="key">Scroll</span> Przełączanie slotu</div>
      <div><span class="key">E</span> Ekwipunek / Skrzynia</div>
      <div><span class="key">PPM</span> Otwieranie skrzyni</div>
      <div><span class="key">M</span> Muzyka ON/OFF</div>
      <div><span class="key">Q</span> Wyrzucenie przedmiotu</div>
    </div>
  </div>

  <!-- Game Bootstrap Module (Cache-busted) -->
  <script type="module" src="js/main.js?v=7.5"></script>
</body>
</html>
